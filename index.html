<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="description" content="Personal site blog of Sayantan Guha Roy.">
  <meta name="keywords" content="sayantangr.net, Sayantan Guha Roy, sayantan, guha roy, sayantangr, 2.5gbps, 10gbps, network, blog, portfolio, shop">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://www.sayantangr.net" />
  <title>Sayantan Guha Roy&#039;s Website </title>
  
  <!-- Google Fonts: Manrope & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text-main: #18181b;
      --text-muted: #52525b;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    main {
      max-width: 640px;
      width: 100%;
    }

    .greeting {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(2.25rem, 5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 2rem;
      color: var(--text-main);
    }

    h1 .title {
      color: var(--accent);
      display: block;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .wave {
      display: inline-block;
      animation: wave 2.5s infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
      60% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>

  <main>
  <span class="greeting">Hello </span> <span class="wave">👋</span>
    <h1>I'm Sayantan — <span class="title">The Web Developer</span></h1>
    <p>
      I started learning to code when I was a teenager, though it was always more of a hobby than a career focus. After a college education in Computer Application, and continuing to pursue that hobby.
    </p>
  </main>

</body>
</html>
